# fly.toml app configuration file generated for swing-trade on 2026-08-09T20:08:17+03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'swing-trade'
primary_region = 'sin'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

  [http_service.http_options]
    idle_timeout = 660

  [[http_service.checks]]
    interval = '30s'
    timeout = '15s'
    grace_period = '2m0s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  size = 'performance-1x'
  memory = '2gb'
